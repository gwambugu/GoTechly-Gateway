<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{email.reset.title}">GoTechly password reset</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
    <p th:text="#{email.reset.greeting(${user.login})}">
        Dear [(${user.login})],
    </p>
    <p th:text="#{email.reset.text1}">
        For your GoTechly account, a password reset was requested, please click on the URL below to reset it:
    </p>
    <p>
        <a th:href="@{|${baseUrl}/api/account/reset-password/finish?key=${user.resetKey}|}"
           th:text="@{|${baseUrl}/api/account/reset-password/finish?key=${user.resetKey}|}">Password Reset Link</a>
    </p>
    <p th:text="#{email.reset.text2}">
        If you did not request this reset, please ignore this email.
    </p>
    <p>
        <span th:text="#{email.reset.text3}">Regards, </span>
        <br />
        <em th:text="#{email.signature}">GoTechly Team.</em>
    </p>
</body>
</html>
