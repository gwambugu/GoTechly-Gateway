<div class="toast-container">
  @for (toast of toasts | async; track toast.id) {
    <div class="toast" [class]="'toast toast-' + toast.type" [class.dismissing]="toast.dismissing" (click)="toastService.dismiss(toast.id)">
      <span class="toast-icon">
        @switch (toast.type) {
          @case ('success') { ✓ }
          @case ('error') { ✕ }
          @case ('warning') { ⚠ }
          @case ('info') { ℹ }
        }
      </span>
      <span class="toast-message">{{ toast.message }}</span>
      <button class="toast-close" (click)="toastService.dismiss(toast.id); $event.stopPropagation()">×</button>
    </div>
  }
</div>
